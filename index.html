<head>

<title>DAILY FUTURE NEWS</title>
<style>
  :root {
    --ink: #1a1a1a;
    --gray: #767676;
    --lightgray: #e5e5e5;
    --accent: #e3120b;
    --clawd: #d97757;
    --bg: #ffffff;
    --bg-soft: #f7f6f4;
    --serif: Georgia, "Times New Roman", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
    --sans: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); color: var(--ink); background: var(--bg); line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  a:hover .card-title, a:hover .list-title, a:hover .pick-title { text-decoration: underline; }

  /* ===== header ===== */
  .masthead { position: relative; border-bottom: 3px solid var(--ink); padding: 22px 16px 14px; }
  .mast-inner { max-width: 1080px; margin: 0 auto; display: flex; align-items: flex-end; gap: 18px; }
  .logo-box { background: var(--accent); color: #fff; font-family: var(--serif); font-weight: 700; font-size: 25px; line-height: 1.08; padding: 12px 18px 13px; letter-spacing: .01em; display: inline-block; }
  .logo-box .l2 { display: block; }
  .edition { font-size: 11px; color: var(--gray); letter-spacing: .12em; padding-bottom: 4px; }
  .clawd { position: absolute; right: 6%; bottom: -3px; width: 52px; height: auto; image-rendering: pixelated; }
  @media (max-width: 640px) { .clawd { right: 12px; width: 42px; } .logo-box { font-size: 20px; } }

  nav.tabs { display: flex; justify-content: center; gap: 0; border-bottom: 1px solid var(--lightgray); overflow-x: auto; white-space: nowrap; position: sticky; top: 0; background: var(--bg); z-index: 20; }
  nav.tabs button { font-family: var(--sans); font-size: 13px; padding: 12px 18px; background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; color: var(--ink); letter-spacing: .05em; }
  nav.tabs button.active { border-bottom-color: var(--accent); font-weight: 700; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 120px; }

  /* ===== section headers ===== */
  .sec-head { display: flex; align-items: baseline; gap: 14px; margin: 34px 0 4px; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
  .sec-head h2 { font-family: var(--serif); font-size: 20px; letter-spacing: .08em; }
  .sec-head .en { font-size: 10px; color: var(--accent); letter-spacing: .22em; font-weight: 700; }
  .sec-head .meta { margin-left: auto; font-size: 11px; color: var(--gray); }

  /* ===== pick (hero) ===== */
  .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .pick { border-bottom: 1px solid var(--lightgray); padding: 22px 18px; position: relative; }
  .pick:nth-child(odd) { border-right: 1px solid var(--lightgray); }
  .pick .kicker { font-size: 10px; font-weight: 700; letter-spacing: .2em; color: var(--accent); text-transform: uppercase; }
  .pick-title { font-family: var(--serif); font-size: 19px; font-weight: 700; line-height: 1.45; margin: 8px 0 6px; }
  .pick .summary { font-size: 12.5px; color: #444; }
  .orig { font-size: 11px; color: var(--gray); margin: -2px 0 6px; }
  .pick .source { font-size: 11px; color: var(--gray); margin-top: 10px; }

  /* ===== article list ===== */
  .item { display: flex; gap: 14px; padding: 16px 4px; border-bottom: 1px solid var(--lightgray); align-items: flex-start; }
  .item .body { flex: 1; min-width: 0; }
  .item .kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; color: var(--accent); text-transform: uppercase; }
  .item .kicker .lane { color: var(--gray); font-weight: 400; margin-left: 8px; letter-spacing: .05em; }
  .list-title { font-family: var(--serif); font-size: 16.5px; font-weight: 700; line-height: 1.5; margin: 4px 0 3px; }
  .note { font-size: 12px; color: var(--accent); margin: 1px 0 2px; }
  .item .summary { font-size: 12.5px; color: #444; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .source { font-size: 11px; color: var(--gray); margin-top: 6px; }

  /* save / dismiss buttons */
  .btns { flex: none; display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .save, .dismiss { width: 40px; height: 40px; border: 1px solid var(--lightgray); border-radius: 50%; background: var(--bg); cursor: pointer; font-size: 17px; line-height: 1; color: var(--gray); transition: all .12s; }
  .save:hover { border-color: var(--accent); color: var(--accent); }
  .save.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dismiss:hover { border-color: var(--ink); color: var(--ink); }
  .dismiss-bar { max-width: 1080px; margin: 10px auto 0; padding: 0 16px; font-size: 11.5px; color: var(--gray); display: flex; align-items: center; gap: 10px; }
  .dismiss-bar button { font-size: 11px; padding: 3px 10px; border: 1px solid var(--lightgray); background: none; color: var(--gray); cursor: pointer; border-radius: 12px; }
  .dismiss-bar button:hover { border-color: var(--ink); color: var(--ink); }

  /* ===== theme block ===== */
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 14px; }
  .theme-card { background: var(--bg-soft); padding: 18px 18px 8px; }
  .theme-card h3 { font-family: var(--serif); font-size: 16px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
  .theme-card .upd { font-size: 10.5px; color: var(--gray); margin: 6px 0 4px; }
  .theme-card .item { padding: 12px 0; }

  /* ===== shadow lane ===== */
  details.shadow { margin-top: 36px; border-top: 3px solid var(--ink); }
  details.shadow summary { cursor: pointer; padding: 14px 4px; font-family: var(--serif); font-size: 15px; letter-spacing: .06em; color: var(--gray); list-style: none; }
  details.shadow summary::before { content: "▸ "; }
  details.shadow[open] summary::before { content: "▾ "; }
  .shadow .item { opacity: .75; }
  .shadow .kicker { color: var(--gray) !important; }

  /* ===== selection tray ===== */
  .tray { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: #fff; display: flex; align-items: center; gap: 12px; padding: 12px 18px; z-index: 50; transform: translateY(110%); transition: transform .18s; }
  .tray.show { transform: translateY(0); }
  .tray .n { font-family: var(--serif); font-size: 15px; }
  .tray .n b { color: #ffb3b3; font-size: 19px; }
  .tray button { font-size: 13px; padding: 9px 16px; border: 1px solid #fff; background: none; color: #fff; cursor: pointer; letter-spacing: .05em; }
  .tray button.primary { background: var(--accent); border-color: var(--accent); font-weight: 700; }
  .tray .spacer { flex: 1; }
  .toast { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; font-size: 13px; padding: 8px 18px; border-radius: 20px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
  .toast.show { opacity: 1; }

  .hidden { display: none !important; }

  @media (max-width: 640px) {
    .picks { grid-template-columns: 1fr; }
    .pick:nth-child(odd) { border-right: none; }
    .pick-title { font-size: 17px; }
    .list-title { font-size: 15.5px; }
  }
</style>
</head>

(function () {
  const G = [
    ".XX......XX.",

    ".XXDXXXXDXX.",

  ];
  const svg = document.getElementById("clawd");

      <button class="dismiss" data-dismiss="${d.id}" title="紙面から削除">−</button>
    </div>
  </div>`;
}
function pickHTML(d) {

document.querySelectorAll("#tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const lane = btn.dataset.lane;
    document.querySelectorAll("[data-sec]").forEach(sec => {
      const s = sec.dataset.sec;
      if (s === "hn" && !(ranked && RANK.hn)) return; // 週刊枠の無い日は出さない
      const show = lane === "all"
        || (lane === "scan"  && (s === "scan"  || s === "picks" || s === "hn"))
        || (lane === "theme" && (s === "theme" || s === "picks"))
        || (lane === "shadow" && s === "shadow");
      sec.classList.toggle("hidden", !show);
      if (s === "shadow" && lane === "shadow") sec.setAttribute("open", "");
    });
  });
});

/* ======================= selection state ======================= */
const KEY = "daily-future-news-picks";
const KEY_DIS = "daily-future-news-dismissed";
let sel = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let dis = new Set(JSON.parse(localStorage.getItem(KEY_DIS) || "[]"));

// SEED: 生成時に焼き込まれた選択/非表示状態を、このブラウザに一度だけ取り込む
if (typeof SEED !== "undefined" && SEED && SEED.version) {
  const seededKey = "daily-future-news-seeded";
  if (localStorage.getItem(seededKey) !== SEED.version) {
    (SEED.picks || []).forEach(id => sel.add(id));
    (SEED.dismissed || []).forEach(id => { dis.add(id); sel.delete(id); });
    localStorage.setItem(seededKey, SEED.version);
  }
}

function paint() {
  document.querySelectorAll(".save").forEach(b => {
    const on = sel.has(b.dataset.save);
    b.classList.toggle("on", on);
    b.textContent = on ? "✓" : "＋";
  });
  document.querySelectorAll(".item, .pick").forEach(el => {
    el.classList.toggle("hidden", dis.has(el.dataset.id));
  });
  $("#sel-count").textContent = sel.size;
  $("#tray").classList.toggle("show", sel.size > 0);
  $("#dis-count").textContent = dis.size;
  $("#dismiss-bar").classList.toggle("hidden", dis.size === 0);
  localStorage.setItem(KEY, JSON.stringify([...sel]));
  localStorage.setItem(KEY_DIS, JSON.stringify([...dis]));
}
document.body.addEventListener("click", e => {
  const b = e.target.closest(".save");
  if (b) {
    const id = b.dataset.save;
    sel.has(id) ? sel.delete(id) : sel.add(id);
    paint();
    return;
  }
  const x = e.target.closest(".dismiss");
  if (x) {
    const id = x.dataset.dismiss;
    dis.add(id);
    sel.delete(id);
    paint();
  }
});
$("#btn-clear").addEventListener("click", () => { sel.clear(); paint(); });
$("#btn-restore").addEventListener("click", () => { dis.clear(); paint(); });
function legacyCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch { ok = false; }
  ta.remove();
  return ok;
}
function showManualCopy(text) {
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;";
  ov.innerHTML = `<div style="background:#fff;max-width:640px;width:100%;padding:20px;">
    <div style="font-size:13px;margin-bottom:8px;">自動コピーできない環境です。下のテキストを全選択してコピーしてください(タップで全選択):</div>
    <textarea readonly style="width:100%;height:220px;font-size:12px;font-family:monospace;"></textarea>
    <div style="text-align:right;margin-top:10px;"><button style="padding:8px 18px;cursor:pointer;">閉じる</button></div>
  </div>`;
  ov.querySelector("textarea").value = text;
  ov.querySelector("textarea").addEventListener("focus", e => e.target.select());
  ov.querySelector("button").addEventListener("click", () => ov.remove());
  document.body.appendChild(ov);
}
$("#btn-copy").addEventListener("click", async () => {
  const rows = DATA.filter(d => sel.has(d.id));
  const text = `scan-picks ${EDITION.date}\n` + rows.map(d => `- [${d.section}] ${d.title}\n  ${d.url}`).join("\n");
  let ok = false;
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); ok = true; } catch { ok = false; }
  }
  if (!ok) ok = legacyCopy(text);
  if (ok) {
    const t = $("#toast"); t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200);
  } else {
    showManualCopy(text);
  }
});
paint();
